bought, never minted</text><rect x="30" y="207" width="5" height="5" fill="#34d399" fill-opacity="0.8"/><text x="42" y="212" font-family="ui-monospace,'Cascadia Mono',Consolas,'DejaVu Sans Mono',monospace" font-size="9" font-weight="400" fill="#cbd5e1" fill-opacity="1" text-anchor="start">Six keys, inert without it</text><text x="30" y="248" font-family="ui-monospace,'Cascadia Mono',Consolas,'DejaVu Sans Mono',monospace" font-size="8.5" font-weight="400" fill="#475569" fill-opacity="1" text-anchor="start" letter-spacing="1.6">OPTIONAL</text><rect x="224" y="52" width="196" height="210" fill="rgba(255,255,255,0.02)" fill-opacity="1" stroke="#334155" stroke-opacity="0.8" stroke-width="1"/><path d="M224 60V52H232" fill="none" stroke="#fb7185" stroke-width="1.5" stroke-opacity="0.75"/><path d="M412 52H420V60" fill="none" stroke="#fb7185" stroke-width="1.5" stroke-opacity="0.75"/><path d="M224 254V262H232" fill="none" stroke="#fb7185" stroke-width="1.5" stroke-opacity="0.75"/><path d="M412 262H420V254" fill="none" stroke="#fb7185" stroke-width="1.5" stroke-opacity="0.75"/><rect x="238" y="70" width="8" height="8" fill="#fb7185" fill-opacity="0.9"/><text x="238" y="102" font-family="ui-monospace,'Cascadia Mono',Consolas,'DejaVu Sans Mono',monospace" font-size="10" font-weight="700" fill="#fb7185" fill-opacity="1" text-anchor="start" letter-spacing="1.1">EPIC MOBS REWORK</text><text x="406" y="78" font-family="ui-monospace,'Cascadia Mono',Consolas,'DejaVu Sans Mono',monospace" font-size="9" font-weight="400" fill="#64748b" fill-opacity="1" text-anchor="end" letter-spacing="1.2">1.0+</text><rect x="238" y="112" width="168" height="1" fill="#fb7185" fill-opacity="0.3"/><rect x="238" y="129" width="5" height="5" fill="#fb7185" fill-opacity="0.8"/><text x="250" y="134" font-family="ui-monospace,'Cascadia Mono',Consolas,'DejaVu Sans Mono',monospace" font-size="9" font-weight="400" fill="#cbd5e1" fill-opacity="1" text-anchor="start">Mobs trigger real CE3 effects</text><rect x="238" y="155" width="5" height="5" fill="#fb7185" fill-opacity="0.8"/><text x="250" y="160" font-family="ui-monospace,'Cascadia Mono',Consolas,'DejaVu Sans Mono',monospace" font-size="9" font-weight="400" fill="#cbd5e1" fill-opacity="1" text-anchor="start">Loot tables drop CE3 items</text><rect x="238" y="181" width="5" height="5" fill="#fb7185" fill-opacity="0.8"/><text x="250" y="186" font-family="ui-monospace,'Cascadia Mono',Consolas,'DejaVu Sans Mono',monospace" font-size="9" font-weight="400" fill="#cbd5e1" fill-opacity="1" text-anchor="start">Kills can pay out in RACO</text><rect x="238" y="207" width="5" height="5" fill="#fb7185" fill-opacity="0.8"/><text x="250" y="212" font-family="ui-monospace,'Cascadia Mono',Consolas,'DejaVu Sans Mono',monospace" font-size="9" font-weight="400" fill="#cbd5e1" fill-opacity="1" text-anchor="start">Boundaries keep mobs out</text><text x="238" y="248" font-family="ui-monospace,'Cascadia Mono',Consolas,'DejaVu Sans Mono',monospace" font-size="8.5" font-weight="400" fill="#475569" fill-opacity="1" text-anchor="start" letter-spacing="1.6">OPTIONAL</text><rect x="432" y="52" width="196" height="210" fill="rgba(255,255,255,0.02)" fill-opacity="1" stroke="#334155" stroke-opacity="0.8" stroke-width="1"/><path d="M432 60V52H440" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.75"/><path d="M620 52H628V60" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.75"/><path d="M432 254V262H440" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.75"/><path d="M620 262H628V254" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.75"/><rect x="446" y="70" width="8" height="8" fill="#38bdf8" fill-opacity="0.9"/><text x="446" y="102" font-family="ui-monospace,'Cascadia Mono',Consolas,'DejaVu Sans Mono',monospace" font-size="10" font-weight="700" fill="#38bdf8" fill-opacity="1" text-anchor="start" letter-spacing="1.1">PLACEHOLDERAPI</text><text x="614" y="78" font-family="ui-monospace,'Cascadia Mono',Consolas,'DejaVu Sans Mono',monospace" font-size="9" font-weight="400" fill="#64748b" fill-opacity="1" text-anchor="end" letter-spacing="1.2">ANY</text><rect x="446" y="112" width="168" height="1" fill="#38bdf8" fill-opacity="0.3"/><rect x="446" y="129" width="5" height="5" fill="#38bdf8" fill-opacity="0.8"/><text x="458" y="134" font-family="ui-monospace,'Cascadia Mono',Consolas,'DejaVu Sans Mono',monospace" font-size="9" font-weight="400" fill="#cbd5e1" fill-opacity="1" text-anchor="start">Level, class, mana, RACO</text><rect x="446" y="155" width="5" height="5" fill="#38bdf8" fill-opacity="0.8"/><text x="458" y="160" font-family="ui-monospace,'Cascadia Mono',Consolas,'DejaVu Sans Mono',monospace" font-size="9" font-weight="400" fill="#cbd5e1" fill-opacity="1" text-anchor="start">Any skill by its own name</text><rect x="446" y="181" width="5" height="5" fill="#38bdf8" fill-opacity="0.8"/><text x="458" y="186" font-family="ui-monospace,'Cascadia Mono',Consolas,'DejaVu Sans Mono',monospace" font-size="9" font-weight="400" fill="#cbd5e1" fill-opacity="1" text-anchor="start">Eight timed paths published</text><rect x="446" y="207" width="5" height="5" fill="#38bdf8" fill-opacity="0.8"/><text x="458" y="212" font-family="ui-monospace,'Cascadia Mono',Consolas,'DejaVu Sans Mono',monospace" font-size="9" font-weight="400" fill="#cbd5e1" fill-opacity="1" text-anchor="start">/ce perf without it</text><text x="446" y="248" font-family="ui-monospace,'Cascadia Mono',Consolas,'DejaVu Sans Mono',monospace" font-size="8.5" font-weight="400" fill="#475569" fill-opacity="1" text-anchor="start" letter-spacing="1.6">OPTIONAL</text><rect x="16" y="274" width="608" height="40" fill="rgba(255,255,255,0.02)" fill-opacity="1" stroke="#334155" stroke-opacity="0.8" stroke-width="1"/><path d="M16 282V274H24" fill="none" stroke="#a3e635" stroke-width="1.5" stroke-opacity="0.75"/><path d="M616 274H624V282" fill="none" stroke="#a3e635" stroke-width="1.5" stroke-opacity="0.75"/><path d="M16 306V314H24" fill="none" stroke="#a3e635" stroke-width="1.5" stroke-opacity="0.75"/><path d="M616 314H624V306" fill="none" stroke="#a3e635" stroke-width="1.5" stroke-opacity="0.75"/><text x="30" y="291" font-family="ui-monospace,'Cascadia Mono',Consolas,'DejaVu Sans Mono',monospace" font-size="9.5" font-weight="700" fill="#a3e635" fill-opacity="1" text-anchor="start" letter-spacing="1.4">ALL THREE ARE STANDALONE PLUGINS</text><text x="30" y="306" font-family="ui-monospace,'Cascadia Mono',Consolas,'DejaVu Sans Mono',monospace" font-size="9" font-weight="400" fill="#94a3b8" fill-opacity="1" text-anchor="start">each one runs on its own and needs none of the others. They are simply compatible.</text>
