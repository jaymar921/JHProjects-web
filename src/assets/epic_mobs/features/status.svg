<text x="624" y="22" font-family="ui-monospace,'Cascadia Mono',Consolas,'DejaVu Sans Mono',monospace" font-size="9.5" font-weight="400" fill="#64748b" fill-opacity="1" text-anchor="end">status</text>
<rect x="18" y="52" width="604" height="124" fill="rgba(255,255,255,0.02)" fill-opacity="1" stroke="#334155" stroke-opacity="0.8" stroke-width="1"/><path d="M18 60V52H26" fill="none" stroke="#fbbf24" stroke-width="1.5" stroke-opacity="0.75"/><path d="M614 52H622V60" fill="none" stroke="#fbbf24" stroke-width="1.5" stroke-opacity="0.75"/><path d="M18 168V176H26" fill="none" stroke="#fbbf24" stroke-width="1.5" stroke-opacity="0.75"/><path d="M614 176H622V168" fill="none" stroke="#fbbf24" stroke-width="1.5" stroke-opacity="0.75"/><text x="34" y="74" font-family="ui-monospace,'Cascadia Mono',Consolas,'DejaVu Sans Mono',monospace" font-size="8.5" font-weight="400" fill="#475569" fill-opacity="1" text-anchor="start" letter-spacing="1.6">WHERE IT GOT TO</text>
<text x="34" y="96" font-family="ui-monospace,'Cascadia Mono',Consolas,'DejaVu Sans Mono',monospace" font-size="8.8" font-weight="400" fill="#cbd5e1" fill-opacity="1" text-anchor="start">Version 1.4.13, April 2023, and that was the last one. It</text>
<text x="34" y="116" font-family="ui-monospace,'Cascadia Mono',Consolas,'DejaVu Sans Mono',monospace" font-size="8.8" font-weight="400" fill="#cbd5e1" fill-opacity="1" text-anchor="start">was a premium plugin and it worked, but a full time job</text>
<text x="34" y="136" font-family="ui-monospace,'Cascadia Mono',Consolas,'DejaVu Sans Mono',monospace" font-size="8.8" font-weight="400" fill="#cbd5e1" fill-opacity="1" text-anchor="start">left no evenings for it, so it stopped rather than rotted</text>
<text x="34" y="156" font-family="ui-monospace,'Cascadia Mono',Consolas,'DejaVu Sans Mono',monospace" font-size="8.8" font-weight="400" fill="#cbd5e1" fill-opacity="1" text-anchor="start">quietly in public. It is not sold and not supported now.</text>
<rect x="18" y="190" width="292" height="76" fill="rgba(255,255,255,0.02)" fill-opacity="1" stroke="#334155" stroke-opacity="0.8" stroke-width="1"/><path d="M18 198V190H26" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.75"/><path d="M302 190H310V198" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.75"/><path d="M18 258V266H26" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.75"/><path d="M302 266H310V258" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.75"/><text x="34" y="212" font-family="ui-monospace,'Cascadia Mono',Consolas,'DejaVu Sans Mono',monospace" font-size="8.5" font-weight="400" fill="#475569" fill-opacity="1" text-anchor="start" letter-spacing="1.6">THE RUN</text>
<rect x="34" y="216" width="260" height="22" fill="rgba(0,0,0,0.45)" fill-opacity="1" stroke="#38bdf8" stroke-opacity="0.35" stroke-width="1"/><rect x="34" y="216" width="3" height="22" fill="#38bdf8" fill-opacity="0.8"/><text x="44" y="230.2" font-family="ui-monospace,'Cascadia Mono',Consolas,'DejaVu Sans Mono',monospace" font-size="9" font-weight="400" fill="#cbd5e1" fill-opacity="1" text-anchor="start">Oct 2021 - Apr 2023</text><text x="286" y="230.2" font-family="ui-monospace,'Cascadia Mono',Consolas,'DejaVu Sans Mono',monospace" font-size="8.6" font-weight="400" fill="#38bdf8" fill-opacity="1" text-anchor="end">18 months</text>
<rect x="34" y="240" width="260" height="20" fill="rgba(0,0,0,0.45)" fill-opacity="1" stroke="#fbbf24" stroke-opacity="0.35" stroke-width="1"/><rect x="34" y="240" width="3" height="20" fill="#fbbf24" fill-opacity="0.8"/><text x="44" y="253.2" font-family="ui-monospace,'Cascadia Mono',Consolas,'DejaVu Sans Mono',monospace" font-size="9" font-weight="400" fill="#cbd5e1" fill-opacity="1" text-anchor="start">Last version</text><text x="286" y="253.2" font-family="ui-monospace,'Cascadia Mono',Consolas,'DejaVu Sans Mono',monospace" font-size="8.6" font-weight="400" fill="#fbbf24" fill-opacity="1" text-anchor="end">1.4.13</text>
<rect x="330" y="190" width="292" height="76" fill="rgba(255,255,255,0.02)" fill-opacity="1" stroke="#334155" stroke-opacity="0.8" stroke-width="1"/><path d="M330 198V190H338" fill="none" stroke="#34d399" stroke-width="1.5" stroke-opacity="0.75"/><path d="M614 190H622V198" fill="none" stroke="#34d399" stroke-width="1.5" stroke-opacity="0.75"/><path d="M330 258V266H338" fill="none" stroke="#34d399" stroke-width="1.5" stroke-opacity="0.75"/><path d="M614 266H622V258" fill="none" stroke="#34d399" stroke-width="1.5" stroke-opacity="0.75"/><text x="346" y="212" font-family="ui-monospace,'Cascadia Mono',Consolas,'DejaVu Sans Mono',monospace" font-size="8.5" font-weight="400" fill="#475569" fill-opacity="1" text-anchor="start" letter-spacing="1.6">EPIC MOBS REWORK</text>
<text x="346" y="234" font-family="ui-monospace,'Cascadia Mono',Consolas,'DejaVu Sans Mono',monospace" font-size="8.2" font-weight="400" fill="#34d399" fill-opacity="1" text-anchor="start">IN DEVELOPMENT. A REWRITE,</text>
<text x="346" y="254" font-family="ui-monospace,'Cascadia Mono',Consolas,'DejaVu Sans Mono',monospace" font-size="8.2" font-weight="400" fill="#cbd5e1" fill-opacity="1" text-anchor="start">NOT A PATCH. STILL NO DATE.</text>
<text x="20" y="288" font-family="ui-monospace,'Cascadia Mono',Consolas,'DejaVu Sans Mono',monospace" font-size="9" font-weight="400" fill="#fbbf24" fill-opacity="1" text-anchor="start">STATUS: ABANDONED</text>
<text x="620" y="288" font-family="ui-monospace,'Cascadia Mono',Consolas,'DejaVu Sans Mono',monospace" font-size="9" font-weight="400" fill="#64748b" fill-opacity="1" text-anchor="end">SOURCE IS PRIVATE</text>
