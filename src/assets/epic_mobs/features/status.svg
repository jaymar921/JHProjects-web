<text x="16" y="348" font-family="ui-monospace,'Cascadia Mono',Consolas,'DejaVu Sans Mono',monospace" font-size="9.5" font-weight="400" fill="#64748b" fill-opacity="1" text-anchor="start" letter-spacing="1.4">A PREMIUM PLUGIN THAT STOPPED - KEPT ON THE SHELF, NOT DELETED</text>
