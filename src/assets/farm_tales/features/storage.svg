<rect x="34" y="108" width="24" height="24" fill="rgba(0,0,0,0.45)" fill-opacity="1" stroke="#334155" stroke-opacity="0.7" stroke-width="1"/>
<rect x="40" y="114" width="12" height="12" fill="#38bdf8" fill-opacity="0.8"/>
<text x="66" y="124" font-family="ui-monospace,'Cascadia Mono',Consolas,'DejaVu Sans Mono',monospace" font-size="8.2" font-weight="400" fill="#cbd5e1" fill-opacity="1" text-anchor="start">with a snowball: rot held off</text>
<rect x="34" y="136" width="24" height="24" fill="rgba(0,0,0,0.45)" fill-opacity="1" stroke="#38bdf8" stroke-opacity="0.7" stroke-width="1"/>
<rect x="40" y="142" width="12" height="12" fill="#38bdf8" fill-opacity="1"/>
