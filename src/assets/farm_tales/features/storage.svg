<text x="34" y="231" font-family="ui-monospace,'Cascadia Mono',Consolas,'DejaVu Sans Mono',monospace" font-size="8.4" font-weight="400" fill="#cbd5e1" fill-opacity="1" text-anchor="start">10 DAYS</text>
<rect x="100" y="224" width="194" height="8" fill="#1e293b" fill-opacity="0.9"/><rect x="100" y="224" width="97" height="8" fill="#fbbf24" fill-opacity="0.85"/>
<text x="34" y="248" font-family="ui-monospace,'Cascadia Mono',Consolas,'DejaVu Sans Mono',monospace" font-size="8.4" font-weight="400" fill="#cbd5e1" fill-opacity="1" text-anchor="start">20 DAYS</text>
