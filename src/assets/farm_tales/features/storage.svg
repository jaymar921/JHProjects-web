<text x="606" y="92" font-family="ui-monospace,'Cascadia Mono',Consolas,'DejaVu Sans Mono',monospace" font-size="8.6" font-weight="400" fill="#c084fc" fill-opacity="1" text-anchor="end">= must</text>
<text x="346" y="108" font-family="ui-monospace,'Cascadia Mono',Consolas,'DejaVu Sans Mono',monospace" font-size="8.6" font-weight="400" fill="#cbd5e1" fill-opacity="1" text-anchor="start">2 brewing grains</text>
<text x="606" y="108" font-family="ui-monospace,'Cascadia Mono',Consolas,'DejaVu Sans Mono',monospace" font-size="8.6" font-weight="400" fill="#fbbf24" fill-opacity="1" text-anchor="end">= wort</text>
<rect x="346" y="116" width="260" height="1" fill="#334155" fill-opacity="0.8"/>
<text x="346" y="132" font-family="ui-monospace,'Cascadia Mono',Consolas,'DejaVu Sans Mono',monospace" font-size="8" font-weight="400" fill="#64748b" fill-opacity="1" text-anchor="start">LEAVE IT IN A CONTAINER WITH SUGAR</text>
<rect x="346" y="142" width="260" height="20" fill="rgba(0,0,0,0.45)" fill-opacity="1" stroke="#c084fc" stroke-opacity="0.35" stroke-width="1"/><rect x="346" y="142" width="3" height="20" fill="#c084fc" fill-opacity="0.8"/><text x="356" y="155.2" font-family="ui-monospace,'Cascadia Mono',Consolas,'DejaVu Sans Mono',monospace" font-size="9" font-weight="400" fill="#cbd5e1" fill-opacity="1" text-anchor="start">YOUNG</text><text x="598" y="155.2" font-family="ui-monospace,'Cascadia Mono',Consolas,'DejaVu Sans Mono',monospace" font-size="8.6" font-weight="400" fill="#c084fc" fill-opacity="1" text-anchor="end">then</text>
<rect x="346" y="166" width="260" height="20" fill="rgba(0,0,0,0.45)" fill-opacity="1" stroke="#c084fc" stroke-opacity="0.35" stroke-width="1"/><rect x="346" y="166" width="3" height="20" fill="#c084fc" fill-opacity="0.8"/><text x="356" y="179.2" font-family="ui-monospace,'Cascadia Mono',Consolas,'DejaVu Sans Mono',monospace" font-size="9" font-weight="400" fill="#cbd5e1" fill-opacity="1" text-anchor="start">MATURE</text><text x="598" y="179.2" font-family="ui-monospace,'Cascadia Mono',Consolas,'DejaVu Sans Mono',monospace" font-size="8.6" font-weight="400" fill="#c084fc" fill-opacity="1" text-anchor="end">then</text>
<rect x="346" y="190" width="260" height="20" fill="rgba(0,0,0,0.45)" fill-opacity="1" stroke="#fbbf24" stroke-opacity="0.35" stroke-width="1"/><rect x="346" y="190" width="3" height="20" fill="#fbbf24" fill-opacity="0.8"/><text x="356" y="203.2" font-family="ui-monospace,'Cascadia Mono',Consolas,'DejaVu Sans Mono',monospace" font-size="9" font-weight="400" fill="#cbd5e1" fill-opacity="1" text-anchor="start">VINTAGE</text><text x="598" y="203.2" font-family="ui-monospace,'Cascadia Mono',Consolas,'DejaVu Sans Mono',monospace" font-size="8.6" font-weight="400" fill="#fbbf24" fill-opacity="1" text-anchor="end">best</text>
<text x="346" y="230" font-family="ui-monospace,'Cascadia Mono',Consolas,'DejaVu Sans Mono',monospace" font-size="8" font-weight="400" fill="#4ade80" fill-opacity="1" text-anchor="start">A WELL-MADE WINE IMPROVES WITH AGE</text>
<text x="346" y="245" font-family="ui-monospace,'Cascadia Mono',Consolas,'DejaVu Sans Mono',monospace" font-size="8" font-weight="400" fill="#fb7185" fill-opacity="1" text-anchor="start">A BADLY MADE ONE GETS WORSE</text>
<text x="346" y="259" font-family="ui-monospace,'Cascadia Mono',Consolas,'DejaVu Sans Mono',monospace" font-size="7.2" font-weight="400" fill="#64748b" fill-opacity="1" text-anchor="start">NOTHING IN THE CONFIG DECIDES WHICH</text>
<text x="20" y="288" font-family="ui-monospace,'Cascadia Mono',Consolas,'DejaVu Sans Mono',monospace" font-size="9" font-weight="400" fill="#cbd5e1" fill-opacity="1" text-anchor="start">BARLEY, OATS, MALT AND HOPS ARE THE BREWING CROPS</text>
<text x="620" y="288" font-family="ui-monospace,'Cascadia Mono',Consolas,'DejaVu Sans Mono',monospace" font-size="9" font-weight="400" fill="#fbbf24" fill-opacity="1" text-anchor="end">PREMIUM</text>
