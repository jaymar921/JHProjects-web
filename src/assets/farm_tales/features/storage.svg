<rect x="330" y="52" width="292" height="214" fill="rgba(255,255,255,0.02)" fill-opacity="1" stroke="#334155" stroke-opacity="0.8" stroke-width="1"/><path d="M330 60V52H338" fill="none" stroke="#c084fc" stroke-width="1.5" stroke-opacity="0.75"/><path d="M614 52H622V60" fill="none" stroke="#c084fc" stroke-width="1.5" stroke-opacity="0.75"/><path d="M330 258V266H338" fill="none" stroke="#c084fc" stroke-width="1.5" stroke-opacity="0.75"/><path d="M614 266H622V258" fill="none" stroke="#c084fc" stroke-width="1.5" stroke-opacity="0.75"/><text x="346" y="74" font-family="ui-monospace,'Cascadia Mono',Consolas,'DejaVu Sans Mono',monospace" font-size="8.5" font-weight="400" fill="#475569" fill-opacity="1" text-anchor="start" letter-spacing="1.6">WINE AND BEER</text>
