<rect x="330" y="168" width="292" height="98" fill="rgba(255,255,255,0.02)" fill-opacity="1" stroke="#334155" stroke-opacity="0.8" stroke-width="1"/><path d="M330 176V168H338" fill="none" stroke="#fbbf24" stroke-width="1.5" stroke-opacity="0.75"/><path d="M614 168H622V176" fill="none" stroke="#fbbf24" stroke-width="1.5" stroke-opacity="0.75"/><path d="M330 258V266H338" fill="none" stroke="#fbbf24" stroke-width="1.5" stroke-opacity="0.75"/><path d="M614 266H622V258" fill="none" stroke="#fbbf24" stroke-width="1.5" stroke-opacity="0.75"/><text x="346" y="190" font-family="ui-monospace,'Cascadia Mono',Consolas,'DejaVu Sans Mono',monospace" font-size="8.5" font-weight="400" fill="#475569" fill-opacity="1" text-anchor="start" letter-spacing="1.6">/ft reload</text>
<text x="346" y="208" font-family="ui-monospace,'Cascadia Mono',Consolas,'DejaVu Sans Mono',monospace" font-size="8.2" font-weight="400" fill="#cbd5e1" fill-opacity="1" text-anchor="start">RE-READS EVERY FILE, NO RESTART</text>
<text x="346" y="222" font-family="ui-monospace,'Cascadia Mono',Consolas,'DejaVu Sans Mono',monospace" font-size="7.8" font-weight="400" fill="#cbd5e1" fill-opacity="1" text-anchor="start">A BAD FILE LEAVES THE OLD CONFIG RUNNING</text>
<text x="346" y="235" font-family="ui-monospace,'Cascadia Mono',Consolas,'DejaVu Sans Mono',monospace" font-size="7.8" font-weight="400" fill="#cbd5e1" fill-opacity="1" text-anchor="start">AND SAYS WHAT BROKE, AND WHERE</text>
<text x="346" y="256" font-family="ui-monospace,'Cascadia Mono',Consolas,'DejaVu Sans Mono',monospace" font-size="7.2" font-weight="400" fill="#64748b" fill-opacity="1" text-anchor="start">RECIPES WANT A RESTART. THE COMMENT SAYS SO</text>
<text x="20" y="288" font-family="ui-monospace,'Cascadia Mono',Consolas,'DejaVu Sans Mono',monospace" font-size="9" font-weight="400" fill="#cbd5e1" fill-opacity="1" text-anchor="start">EVERY KEY HAS A COMMENT ABOVE IT EXPLAINING WHAT IT DOES</text>
<text x="620" y="288" font-family="ui-monospace,'Cascadia Mono',Consolas,'DejaVu Sans Mono',monospace" font-size="9" font-weight="400" fill="#64748b" fill-opacity="1" text-anchor="end">BOTH EDITIONS</text>
