<text x="34" y="247" font-family="ui-monospace,'Cascadia Mono',Consolas,'DejaVu Sans Mono',monospace" font-size="8.2" font-weight="400" fill="#cbd5e1" fill-opacity="1" text-anchor="start"></text>
