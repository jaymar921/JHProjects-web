<rect x="34" y="188" width="308" height="22" fill="rgba(0,0,0,0.45)" fill-opacity="1" stroke="#34d399" stroke-opacity="0.35" stroke-width="1"/><rect x="34" y="188" width="3" height="22" fill="#34d399" fill-opacity="0.8"/><text x="44" y="202.2" font-family="ui-monospace,'Cascadia Mono',Consolas,'DejaVu Sans Mono',monospace" font-size="9" font-weight="400" fill="#cbd5e1" fill-opacity="1" text-anchor="start">e.layers</text><text x="334" y="202.2" font-family="ui-monospace,'Cascadia Mono',Consolas,'DejaVu Sans Mono',monospace" font-size="8.6" font-weight="400" fill="#34d399" fill-opacity="1" text-anchor="end">[3 sprites]</text>
<text x="34" y="228" font-family="ui-monospace,'Cascadia Mono',Consolas,'DejaVu Sans Mono',monospace" font-size="7.8" font-weight="400" fill="#475569" fill-opacity="1" text-anchor="start">TOP-MOST SPRITE FIRST, EVERYTHING UNDER IT</text>
<text x="34" y="246" font-family="ui-monospace,'Cascadia Mono',Consolas,'DejaVu Sans Mono',monospace" font-size="7.8" font-weight="400" fill="#475569" fill-opacity="1" text-anchor="start">IN e.layers. COMPARE STRAIGHT AGAINST</text>
<text x="34" y="260" font-family="ui-monospace,'Cascadia Mono',Consolas,'DejaVu Sans Mono',monospace" font-size="7.8" font-weight="400" fill="#475569" fill-opacity="1" text-anchor="start">sprite.posX AND sprite.posY.</text>
<rect x="370" y="52" width="252" height="118" fill="rgba(255,255,255,0.02)" fill-opacity="1" stroke="#334155" stroke-opacity="0.8" stroke-width="1"/><path d="M370 60V52H378" fill="none" stroke="#22d3ee" stroke-width="1.5" stroke-opacity="0.75"/><path d="M614 52H622V60" fill="none" stroke="#22d3ee" stroke-width="1.5" stroke-opacity="0.75"/><path d="M370 162V170H378" fill="none" stroke="#22d3ee" stroke-width="1.5" stroke-opacity="0.75"/><path d="M614 170H622V162" fill="none" stroke="#22d3ee" stroke-width="1.5" stroke-opacity="0.75"/><text x="386" y="74" font-family="ui-monospace,'Cascadia Mono',Consolas,'DejaVu Sans Mono',monospace" font-size="8.5" font-weight="400" fill="#475569" fill-opacity="1" text-anchor="start" letter-spacing="1.6">PAN</text>
<path d="M400 130h180" stroke="#22d3ee" stroke-width="1.5" stroke-opacity="0.6" stroke-dasharray="6 5"/>
<path d="M580 130l-9-5v10z" fill="#22d3ee" fill-opacity="0.85"/>
<path d="M400 130l9-5v10z" fill="#22d3ee" fill-opacity="0.85"/>
<text x="386" y="108" font-family="ui-monospace,'Cascadia Mono',Consolas,'DejaVu Sans Mono',monospace" font-size="8.2" font-weight="400" fill="#cbd5e1" fill-opacity="1" text-anchor="start">enableScreenDrag(true)</text>
<text x="386" y="156" font-family="ui-monospace,'Cascadia Mono',Consolas,'DejaVu Sans Mono',monospace" font-size="7.4" font-weight="400" fill="#475569" fill-opacity="1" text-anchor="start">DELTA IS DIVIDED BY SCALE, SO</text>
<text x="386" y="166" font-family="ui-monospace,'Cascadia Mono',Consolas,'DejaVu Sans Mono',monospace" font-size="7.4" font-weight="400" fill="#475569" fill-opacity="1" text-anchor="start">PAN SPEED FEELS THE SAME AT ANY ZOOM</text>
<rect x="370" y="182" width="252" height="84" fill="rgba(255,255,255,0.02)" fill-opacity="1" stroke="#334155" stroke-opacity="0.8" stroke-width="1"/><path d="M370 190V182H378" fill="none" stroke="#a78bfa" stroke-width="1.5" stroke-opacity="0.75"/><path d="M614 182H622V190" fill="none" stroke="#a78bfa" stroke-width="1.5" stroke-opacity="0.75"/><path d="M370 258V266H378" fill="none" stroke="#a78bfa" stroke-width="1.5" stroke-opacity="0.75"/><path d="M614 266H622V258" fill="none" stroke="#a78bfa" stroke-width="1.5" stroke-opacity="0.75"/><text x="386" y="204" font-family="ui-monospace,'Cascadia Mono',Consolas,'DejaVu Sans Mono',monospace" font-size="8.5" font-weight="400" fill="#475569" fill-opacity="1" text-anchor="start" letter-spacing="1.6">ZOOM</text>
<text x="386" y="212" font-family="ui-monospace,'Cascadia Mono',Consolas,'DejaVu Sans Mono',monospace" font-size="8.2" font-weight="400" fill="#cbd5e1" fill-opacity="1" text-anchor="start">enableScreenZoom(true)</text>
<text x="386" y="230" font-family="ui-monospace,'Cascadia Mono',Consolas,'DejaVu Sans Mono',monospace" font-size="8.2" font-weight="400" fill="#cbd5e1" fill-opacity="1" text-anchor="start">setZoomSpeed(0.05)</text>
<rect x="386" y="242" width="220" height="6" fill="#1e293b" fill-opacity="0.9"/><rect x="386" y="242" width="136" height="6" fill="#a78bfa" fill-opacity="0.85"/>
<text x="386" y="262" font-family="ui-monospace,'Cascadia Mono',Consolas,'DejaVu Sans Mono',monospace" font-size="7.2" font-weight="400" fill="#475569" fill-opacity="1" text-anchor="start">CENTRED ON THE VIEWPORT, CLAMPED TO 4DP</text>
<text x="20" y="288" font-family="ui-monospace,'Cascadia Mono',Consolas,'DejaVu Sans Mono',monospace" font-size="9" font-weight="400" fill="#cbd5e1" fill-opacity="1" text-anchor="start">A TAP NEVER FIRES AS A DRAG</text>
<text x="620" y="288" font-family="ui-monospace,'Cascadia Mono',Consolas,'DejaVu Sans Mono',monospace" font-size="8.6" font-weight="400" fill="#64748b" fill-opacity="1" text-anchor="end">4px MOVEMENT THRESHOLD</text>
