<rect x="18" y="52" width="340" height="214" fill="rgba(255,255,255,0.02)" fill-opacity="1" stroke="#334155" stroke-opacity="0.8" stroke-width="1"/><path d="M18 60V52H26" fill="none" stroke="#fbbf24" stroke-width="1.5" stroke-opacity="0.75"/><path d="M350 52H358V60" fill="none" stroke="#fbbf24" stroke-width="1.5" stroke-opacity="0.75"/><path d="M18 258V266H26" fill="none" stroke="#fbbf24" stroke-width="1.5" stroke-opacity="0.75"/><path d="M350 266H358V258" fill="none" stroke="#fbbf24" stroke-width="1.5" stroke-opacity="0.75"/><text x="34" y="74" font-family="ui-monospace,'Cascadia Mono',Consolas,'DejaVu Sans Mono',monospace" font-size="8.5" font-weight="400" fill="#475569" fill-opacity="1" text-anchor="start" letter-spacing="1.6">CLICK EVENT</text>
<rect x="34" y="84" width="308" height="22" fill="rgba(0,0,0,0.45)" fill-opacity="1" stroke="#a78bfa" stroke-opacity="0.35" stroke-width="1"/><rect x="34" y="84" width="3" height="22" fill="#a78bfa" fill-opacity="0.8"/><text x="44" y="98.2" font-family="ui-monospace,'Cascadia Mono',Consolas,'DejaVu Sans Mono',monospace" font-size="9" font-weight="400" fill="#cbd5e1" fill-opacity="1" text-anchor="start">e.objID</text><text x="334" y="98.2" font-family="ui-monospace,'Cascadia Mono',Consolas,'DejaVu Sans Mono',monospace" font-size="8.6" font-weight="400" fill="#a78bfa" fill-opacity="1" text-anchor="end">'player-1'</text>
<rect x="34" y="110" width="308" height="22" fill="rgba(0,0,0,0.45)" fill-opacity="1" stroke="#22d3ee" stroke-opacity="0.35" stroke-width="1"/><rect x="34" y="110" width="3" height="22" fill="#22d3ee" fill-opacity="0.8"/><text x="44" y="124.2" font-family="ui-monospace,'Cascadia Mono',Consolas,'DejaVu Sans Mono',monospace" font-size="9" font-weight="400" fill="#cbd5e1" fill-opacity="1" text-anchor="start">e.type</text><text x="334" y="124.2" font-family="ui-monospace,'Cascadia Mono',Consolas,'DejaVu Sans Mono',monospace" font-size="8.6" font-weight="400" fill="#22d3ee" fill-opacity="1" text-anchor="end">SpriteType.PLAYER</text>
<rect x="34" y="136" width="308" height="22" fill="rgba(0,0,0,0.45)" fill-opacity="1" stroke="#fbbf24" stroke-opacity="0.35" stroke-width="1"/><rect x="34" y="136" width="3" height="22" fill="#fbbf24" fill-opacity="0.8"/><text x="44" y="150.2" font-family="ui-monospace,'Cascadia Mono',Consolas,'DejaVu Sans Mono',monospace" font-size="9" font-weight="400" fill="#cbd5e1" fill-opacity="1" text-anchor="start">e.mousePosition.x</text><text x="334" y="150.2" font-family="ui-monospace,'Cascadia Mono',Consolas,'DejaVu Sans Mono',monospace" font-size="8.6" font-weight="400" fill="#fbbf24" fill-opacity="1" text-anchor="end">412.5</text>
