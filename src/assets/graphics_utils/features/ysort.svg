<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" role="img" aria-label="Y-SORT DEPTH">
<defs>
<pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#94a3b8" stroke-opacity="0.055"/></pattern>
<pattern id="scan" width="3" height="3" patternUnits="userSpaceOnUse"><rect width="3" height="1" fill="#000" fill-opacity="0.18"/></pattern>
<radialGradient id="vig" cx="50%" cy="45%" r="72%"><stop offset="55%" stop-color="#000" stop-opacity="0"/><stop offset="100%" stop-color="#000" stop-opacity="0.55"/></radialGradient>
<linearGradient id="rule" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#34d399" stop-opacity="0.7"/><stop offset="100%" stop-color="#34d399" stop-opacity="0"/></linearGradient>
</defs>
<rect x="0" y="0" width="640" height="360" fill="#0b0d11" fill-opacity="1"/>
<rect x="0" y="34" width="640" height="292" fill="url(#grid)" fill-opacity="1"/>
<rect x="0" y="0" width="640" height="34" fill="rgba(255,255,255,0.03)" fill-opacity="1"/>
<rect x="0" y="33" width="640" height="1" fill="#334155" fill-opacity="0.8"/>
<rect x="14" y="14" width="7" height="7" fill="#fb7185" fill-opacity="0.8"/>
<rect x="27" y="14" width="7" height="7" fill="#fbbf24" fill-opacity="0.8"/>
<rect x="40" y="14" width="7" height="7" fill="#34d399" fill-opacity="0.8"/>
<text x="60" y="22" font-family="ui-monospace,'Cascadia Mono',Consolas,'DejaVu Sans Mono',monospace" font-size="12" font-weight="700" fill="#34d399" fill-opacity="1" text-anchor="start" letter-spacing="2.2">Y-SORT DEPTH</text>
<text x="624" y="22" font-family="ui-monospace,'Cascadia Mono',Consolas,'DejaVu Sans Mono',monospace" font-size="9.5" font-weight="400" fill="#64748b" fill-opacity="1" text-anchor="end">setYsort(true)</text>
<rect x="18" y="52" width="300" height="214" fill="rgba(255,255,255,0.02)" fill-opacity="1" stroke="#334155" stroke-opacity="0.8" stroke-width="1"/><path d="M18 60V52H26" fill="none" stroke="#34d399" stroke-width="1.5" stroke-opacity="0.75"/><path d="M310 52H318V60" fill="none" stroke="#34d399" stroke-width="1.5" stroke-opacity="0.75"/><path d="M18 258V266H26" fill="none" stroke="#34d399" stroke-width="1.5" stroke-opacity="0.75"/><path d="M310 266H318V258" fill="none" stroke="#34d399" stroke-width="1.5" stroke-opacity="0.75"/><text x="34" y="74" font-family="ui-monospace,'Cascadia Mono',Consolas,'DejaVu Sans Mono',monospace" font-size="8.5" font-weight="400" fill="#475569" fill-opacity="1" text-anchor="start" letter-spacing="1.6">PLAYER BEHIND THE TREE</text>
<rect x="150" y="84" width="56" height="96" fill="#34d399" fill-opacity="0.3" stroke="#34d399" stroke-opacity="0.6" stroke-width="1"/>
<text x="178" y="76" font-family="ui-monospace,'Cascadia Mono',Consolas,'DejaVu Sans Mono',monospace" font-size="7.5" font-weight="400" fill="#34d399" fill-opacity="1" text-anchor="middle">TREE</text>
<rect x="160" y="150" width="36" height="52" fill="#a78bfa" fill-opacity="0.75" stroke="#a78bfa" stroke-opacity="0.9" stroke-width="1"/>
<text x="178" y="216" font-family="ui-monospace,'Cascadia Mono',Consolas,'DejaVu Sans Mono',monospace" font-size="7.5" font-weight="400" fill="#a78bfa" fill-opacity="1" text-anchor="middle">PLAYER</text>
<path d="M60 180h60" stroke="#475569" stroke-width="1" stroke-dasharray="3 3"/>
<text x="60" y="176" font-family="ui-monospace,'Cascadia Mono',Consolas,'DejaVu Sans Mono',monospace" font-size="7" font-weight="400" fill="#475569" fill-opacity="1" text-anchor="start">bottom edge</text>
<text x="34" y="244" font-family="ui-monospace,'Cascadia Mono',Consolas,'DejaVu Sans Mono',monospace" font-size="7.8" font-weight="400" fill="#cbd5e1" fill-opacity="1" text-anchor="start">THE TREE SITS LOWER, SO IT DRAWS IN FRONT,</text>
<text x="34" y="258" font-family="ui-monospace,'Cascadia Mono',Consolas,'DejaVu Sans Mono',monospace" font-size="7.8" font-weight="400" fill="#cbd5e1" fill-opacity="1" text-anchor="start">AND FADES SO THE PLAYER STAYS VISIBLE.</text>
<rect x="330" y="52" width="292" height="118" fill="rgba(255,255,255,0.02)" fill-opacity="1" stroke="#334155" stroke-opacity="0.8" stroke-width="1"/><path d="M330 60V52H338" fill="none" stroke="#22d3ee" stroke-width="1.5" stroke-opacity="0.75"/><path d="M614 52H622V60" fill="none" stroke="#22d3ee" stroke-width="1.5" stroke-opacity="0.75"/><path d="M330 162V170H338" fill="none" stroke="#22d3ee" stroke-width="1.5" stroke-opacity="0.75"/><path d="M614 170H622V162" fill="none" stroke="#22d3ee" stroke-width="1.5" stroke-opacity="0.75"/><text x="346" y="74" font-family="ui-monospace,'Cascadia Mono',Consolas,'DejaVu Sans Mono',monospace" font-size="8.5" font-weight="400" fill="#475569" fill-opacity="1" text-anchor="start" letter-spacing="1.6">THE THREE KNOBS</text>
<rect x="346" y="84" width="260" height="22" fill="rgba(0,0,0,0.45)" fill-opacity="1" stroke="#34d399" stroke-opacity="0.35" stroke-width="1"/><rect x="346" y="84" width="3" height="22" fill="#34d399" fill-opacity="0.8"/><text x="356" y="98.2" font-family="ui-monospace,'Cascadia Mono',Consolas,'DejaVu Sans Mono',monospace" font-size="9" font-weight="400" fill="#cbd5e1" fill-opacity="1" text-anchor="start">setYsort</text><text x="598" y="98.2" font-family="ui-monospace,'Cascadia Mono',Consolas,'DejaVu Sans Mono',monospace" font-size="8.6" font-weight="400" fill="#34d399" fill-opacity="1" text-anchor="end">true</text>
<rect x="346" y="110" width="260" height="22" fill="rgba(0,0,0,0.45)" fill-opacity="1" stroke="#a78bfa" stroke-opacity="0.35" stroke-width="1"/><rect x="346" y="110" width="3" height="22" fill="#a78bfa" fill-opacity="0.8"/><text x="356" y="124.2" font-family="ui-monospace,'Cascadia Mono',Consolas,'DejaVu Sans Mono',monospace" font-size="9" font-weight="400" fill="#cbd5e1" fill-opacity="1" text-anchor="start">setBehindOpacity</text><text x="598" y="124.2" font-family="ui-monospace,'Cascadia Mono',Consolas,'DejaVu Sans Mono',monospace" font-size="8.6" font-weight="400" fill="#a78bfa" fill-opacity="1" text-anchor="end">0.5</text>
<rect x="346" y="136" width="260" height="22" fill="rgba(0,0,0,0.45)" fill-opacity="1" stroke="#fbbf24" stroke-opacity="0.35" stroke-width="1"/><rect x="346" y="136" width="3" height="22" fill="#fbbf24" fill-opacity="0.8"/><text x="356" y="150.2" font-family="ui-monospace,'Cascadia Mono',Consolas,'DejaVu Sans Mono',monospace" font-size="9" font-weight="400" fill="#cbd5e1" fill-opacity="1" text-anchor="start">setOverlapThreshold</text><text x="598" y="150.2" font-family="ui-monospace,'Cascadia Mono',Consolas,'DejaVu Sans Mono',monospace" font-size="8.6" font-weight="400" fill="#fbbf24" fill-opacity="1" text-anchor="end">0.1</text>
<text x="346" y="163" font-family="ui-monospace,'Cascadia Mono',Consolas,'DejaVu Sans Mono',monospace" font-size="7.4" font-weight="400" fill="#475569" fill-opacity="1" text-anchor="start">OVERLAP IS AREA RELATIVE TO THE SMALLER BOX</text>
<rect x="330" y="182" width="292" height="84" fill="rgba(255,255,255,0.02)" fill-opacity="1" stroke="#334155" stroke-opacity="0.8" stroke-width="1"/><path d="M330 190V182H338" fill="none" stroke="#fbbf24" stroke-width="1.5" stroke-opacity="0.75"/><path d="M614 182H622V190" fill="none" stroke="#fbbf24" stroke-width="1.5" stroke-opacity="0.75"/><path d="M330 258V266H338" fill="none" stroke="#fbbf24" stroke-width="1.5" stroke-opacity="0.75"/><path d="M614 266H622V258" fill="none" stroke="#fbbf24" stroke-width="1.5" stroke-opacity="0.75"/><text x="346" y="204" font-family="ui-monospace,'Cascadia Mono',Consolas,'DejaVu Sans Mono',monospace" font-size="8.5" font-weight="400" fill="#475569" fill-opacity="1" text-anchor="start" letter-spacing="1.6">RENDER ORDER</text>
<text x="346" y="212" font-family="ui-monospace,'Cascadia Mono',Consolas,'DejaVu Sans Mono',monospace" font-size="8.4" font-weight="400" fill="#475569" fill-opacity="1" text-anchor="start">1  BACKGROUND</text>
<text x="346" y="230" font-family="ui-monospace,'Cascadia Mono',Consolas,'DejaVu Sans Mono',monospace" font-size="8.4" font-weight="400" fill="#cbd5e1" fill-opacity="1" text-anchor="start">2  WORLD SPRITES, SORTED BY BOTTOM EDGE</text>
<text x="346" y="248" font-family="ui-monospace,'Cascadia Mono',Consolas,'DejaVu Sans Mono',monospace" font-size="8.4" font-weight="400" fill="#fb7185" fill-opacity="1" text-anchor="start">3  STATIC, THE HUD LAYER, ALWAYS LAST</text>
<text x="346" y="262" font-family="ui-monospace,'Cascadia Mono',Consolas,'DejaVu Sans Mono',monospace" font-size="7.2" font-weight="400" fill="#475569" fill-opacity="1" text-anchor="start">REUSED ARRAYS, NO PER-FRAME ALLOCATION</text>
<text x="20" y="288" font-family="ui-monospace,'Cascadia Mono',Consolas,'DejaVu Sans Mono',monospace" font-size="9.5" font-weight="400" fill="#34d399" fill-opacity="1" text-anchor="start">NEW IN v1.3.0</text>
<text x="160" y="288" font-family="ui-monospace,'Cascadia Mono',Consolas,'DejaVu Sans Mono',monospace" font-size="8.6" font-weight="400" fill="#64748b" fill-opacity="1" text-anchor="start">FOR TOP-DOWN GAMES WHERE DEPTH HAS TO READ RIGHT</text>
<rect x="0" y="326" width="640" height="1" fill="#334155" fill-opacity="0.8"/>
<rect x="0" y="327" width="640" height="33" fill="rgba(255,255,255,0.02)" fill-opacity="1"/>
<rect x="0" y="327" width="220" height="2" fill="url(#rule)" fill-opacity="1"/>
<text x="16" y="348" font-family="ui-monospace,'Cascadia Mono',Consolas,'DejaVu Sans Mono',monospace" font-size="9.5" font-weight="400" fill="#64748b" fill-opacity="1" text-anchor="start" letter-spacing="1.4">TOP-DOWN DEPTH ORDER, SORTED BY BOTTOM EDGE EVERY FRAME</text>
<rect x="0" y="34" width="640" height="292" fill="url(#scan)" fill-opacity="1"/>
<rect x="0" y="0" width="640" height="360" fill="url(#vig)" fill-opacity="1"/>
<rect x="0.5" y="0.5" width="639" height="359" fill="none" fill-opacity="1" stroke="#334155" stroke-opacity="1" stroke-width="1"/>
<path d="M4 18V4H18" fill="none" stroke="#34d399" stroke-width="2" stroke-opacity="0.75"/><path d="M622 4H636V18" fill="none" stroke="#34d399" stroke-width="2" stroke-opacity="0.75"/><path d="M4 342V356H18" fill="none" stroke="#34d399" stroke-width="2" stroke-opacity="0.75"/><path d="M622 356H636V342" fill="none" stroke="#34d399" stroke-width="2" stroke-opacity="0.75"/>
</svg>
