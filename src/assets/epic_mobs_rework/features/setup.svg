<text x="346" y="88" font-family="ui-monospace,'Cascadia Mono',Consolas,'DejaVu Sans Mono',monospace" font-size="9" font-weight="400" fill="#fb7185" fill-opacity="1" text-anchor="start">/ep debug spawn</text>
<text x="346" y="110" font-family="ui-monospace,'Cascadia Mono',Consolas,'DejaVu Sans Mono',monospace" font-size="8" font-weight="400" fill="#cbd5e1" fill-opacity="1" text-anchor="start">IT PRINTS THE REASON FOR EVERY</text>
<text x="346" y="128" font-family="ui-monospace,'Cascadia Mono',Consolas,'DejaVu Sans Mono',monospace" font-size="8" font-weight="400" fill="#cbd5e1" fill-opacity="1" text-anchor="start">SINGLE REFUSAL, WHICH IS ALMOST</text>
<text x="346" y="146" font-family="ui-monospace,'Cascadia Mono',Consolas,'DejaVu Sans Mono',monospace" font-size="8" font-weight="400" fill="#cbd5e1" fill-opacity="1" text-anchor="start">ALWAYS THE WHOLE ANSWER.</text>
<text x="346" y="162" font-family="ui-monospace,'Cascadia Mono',Consolas,'DejaVu Sans Mono',monospace" font-size="7.4" font-weight="400" fill="#64748b" fill-opacity="1" text-anchor="start">A PROTECTION LAYER, THE WORLD LIST, OR A CONDITION</text>
<rect x="330" y="182" width="292" height="84" fill="rgba(255,255,255,0.02)" fill-opacity="1" stroke="#334155" stroke-opacity="0.8" stroke-width="1"/><path d="M330 190V182H338" fill="none" stroke="#fbbf24" stroke-width="1.5" stroke-opacity="0.75"/><path d="M614 182H622V190" fill="none" stroke="#fbbf24" stroke-width="1.5" stroke-opacity="0.75"/><path d="M330 258V266H338" fill="none" stroke="#fbbf24" stroke-width="1.5" stroke-opacity="0.75"/><path d="M614 266H622V258" fill="none" stroke="#fbbf24" stroke-width="1.5" stroke-opacity="0.75"/><text x="346" y="204" font-family="ui-monospace,'Cascadia Mono',Consolas,'DejaVu Sans Mono',monospace" font-size="8.5" font-weight="400" fill="#475569" fill-opacity="1" text-anchor="start" letter-spacing="1.6">WHAT TO CHECK FIRST</text>
<text x="346" y="224" font-family="ui-monospace,'Cascadia Mono',Consolas,'DejaVu Sans Mono',monospace" font-size="8" font-weight="400" fill="#fbbf24" fill-opacity="1" text-anchor="start">EDITION LINE ON BOOT, AND IN /ep info</text>
<text x="346" y="242" font-family="ui-monospace,'Cascadia Mono',Consolas,'DejaVu Sans Mono',monospace" font-size="8" font-weight="400" fill="#cbd5e1" fill-opacity="1" text-anchor="start">THE TWO JARS LOOK IDENTICAL IN THE</text>
<text x="346" y="260" font-family="ui-monospace,'Cascadia Mono',Consolas,'DejaVu Sans Mono',monospace" font-size="8" font-weight="400" fill="#cbd5e1" fill-opacity="1" text-anchor="start">PLUGINS FOLDER APART FROM THE NAME</text>
<text x="20" y="288" font-family="ui-monospace,'Cascadia Mono',Consolas,'DejaVu Sans Mono',monospace" font-size="9" font-weight="400" fill="#cbd5e1" fill-opacity="1" text-anchor="start">DO IT ON A TEST SERVER. /ep clear TIDIES UP AFTER YOU</text>
<text x="620" y="288" font-family="ui-monospace,'Cascadia Mono',Consolas,'DejaVu Sans Mono',monospace" font-size="9" font-weight="400" fill="#64748b" fill-opacity="1" text-anchor="end">NO RESTART NEEDED</text>
