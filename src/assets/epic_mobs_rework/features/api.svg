<rect x="0" y="0" width="640" height="34" fill="rgba(255,255,255,0.03)" fill-opacity="1"/>
<rect x="0" y="33" width="640" height="1" fill="#334155" fill-opacity="0.8"/>
<rect x="14" y="14" width="7" height="7" fill="#fb7185" fill-opacity="0.8"/>
<rect x="27" y="14" width="7" height="7" fill="#fbbf24" fill-opacity="0.8"/>
<rect x="40" y="14" width="7" height="7" fill="#34d399" fill-opacity="0.8"/>
<text x="60" y="22" font-family="ui-monospace,'Cascadia Mono',Consolas,'DejaVu Sans Mono',monospace" font-size="12" font-weight="700" fill="#c084fc" fill-opacity="1" text-anchor="start" letter-spacing="2.2">THE DEVELOPER API</text>
<text x="624" y="22" font-family="ui-monospace,'Cascadia Mono',Consolas,'DejaVu Sans Mono',monospace" font-size="9.5" font-weight="400" fill="#64748b" fill-opacity="1" text-anchor="end">me.jaymar921.epicmobs.api</text>
<rect x="18" y="52" width="604" height="74" fill="rgba(255,255,255,0.02)" fill-opacity="1" stroke="#334155" stroke-opacity="0.8" stroke-width="1"/><path d="M18 60V52H26" fill="none" stroke="#c084fc" stroke-width="1.5" stroke-opacity="0.75"/><path d="M614 52H622V60" fill="none" stroke="#c084fc" stroke-width="1.5" stroke-opacity="0.75"/><path d="M18 118V126H26" fill="none" stroke="#c084fc" stroke-width="1.5" stroke-opacity="0.75"/><path d="M614 126H622V118" fill="none" stroke="#c084fc" stroke-width="1.5" stroke-opacity="0.75"/><text x="34" y="74" font-family="ui-monospace,'Cascadia Mono',Consolas,'DejaVu Sans Mono',monospace" font-size="8.5" font-weight="400" fill="#475569" fill-opacity="1" text-anchor="start" letter-spacing="1.6">ONE JAR, AND NOTHING INTERNAL IN IT</text>
<text x="34" y="94" font-family="ui-monospace,'Cascadia Mono',Consolas,'DejaVu Sans Mono',monospace" font-size="9.5" font-weight="400" fill="#c084fc" fill-opacity="1" text-anchor="start">EpicMobsRework-api.jar</text>
<text x="230" y="94" font-family="ui-monospace,'Cascadia Mono',Consolas,'DejaVu Sans Mono',monospace" font-size="8.4" font-weight="400" fill="#cbd5e1" fill-opacity="1" text-anchor="start">provided SCOPE, LIKE SPIGOT</text>
<text x="34" y="114" font-family="ui-monospace,'Cascadia Mono',Consolas,'DejaVu Sans Mono',monospace" font-size="8" font-weight="400" fill="#cbd5e1" fill-opacity="1" text-anchor="start">NOTHING IN THE PACKAGE NAMES A CLASS OUTSIDE IT BUT BUKKIT AND THE JDK</text>
<rect x="18" y="138" width="292" height="128" fill="rgba(255,255,255,0.02)" fill-opacity="1" stroke="#334155" stroke-opacity="0.8" stroke-width="1"/><path d="M18 146V138H26" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.75"/><path d="M302 138H310V146" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.75"/><path d="M18 258V266H26" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.75"/><path d="M302 266H310V258" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.75"/><text x="34" y="160" font-family="ui-monospace,'Cascadia Mono',Consolas,'DejaVu Sans Mono',monospace" font-size="8.5" font-weight="400" fill="#475569" fill-opacity="1" text-anchor="start" letter-spacing="1.6">WHAT YOU GET</text>
<rect x="34" y="168" width="260" height="20" fill="rgba(0,0,0,0.45)" fill-opacity="1" stroke="#38bdf8" stroke-opacity="0.35" stroke-width="1"/><rect x="34" y="168" width="3" height="20" fill="#38bdf8" fill-opacity="0.8"/><text x="44" y="181.2" font-family="ui-monospace,'Cascadia Mono',Consolas,'DejaVu Sans Mono',monospace" font-size="9" font-weight="400" fill="#cbd5e1" fill-opacity="1" text-anchor="start">views</text><text x="286" y="181.2" font-family="ui-monospace,'Cascadia Mono',Consolas,'DejaVu Sans Mono',monospace" font-size="8.6" font-weight="400" fill="#38bdf8" fill-opacity="1" text-anchor="end">4</text>
<rect x="34" y="190" width="260" height="20" fill="rgba(0,0,0,0.45)" fill-opacity="1" stroke="#38bdf8" stroke-opacity="0.35" stroke-width="1"/><rect x="34" y="190" width="3" height="20" fill="#38bdf8" fill-opacity="0.8"/><text x="44" y="203.2" font-family="ui-monospace,'Cascadia Mono',Consolas,'DejaVu Sans Mono',monospace" font-size="9" font-weight="400" fill="#cbd5e1" fill-opacity="1" text-anchor="start">queries</text><text x="286" y="203.2" font-family="ui-monospace,'Cascadia Mono',Consolas,'DejaVu Sans Mono',monospace" font-size="8.6" font-weight="400" fill="#38bdf8" fill-opacity="1" text-anchor="end">10</text>
<rect x="34" y="212" width="260" height="20" fill="rgba(0,0,0,0.45)" fill-opacity="1" stroke="#fb7185" stroke-opacity="0.35" stroke-width="1"/><rect x="34" y="212" width="3" height="20" fill="#fb7185" fill-opacity="0.8"/><text x="44" y="225.2" font-family="ui-monospace,'Cascadia Mono',Consolas,'DejaVu Sans Mono',monospace" font-size="9" font-weight="400" fill="#cbd5e1" fill-opacity="1" text-anchor="start">events</text><text x="286" y="225.2" font-family="ui-monospace,'Cascadia Mono',Consolas,'DejaVu Sans Mono',monospace" font-size="8.6" font-weight="400" fill="#fb7185" fill-opacity="1" text-anchor="end">11</text>
<rect x="34" y="234" width="260" height="20" fill="rgba(0,0,0,0.45)" fill-opacity="1" stroke="#fbbf24" stroke-opacity="0.35" stroke-width="1"/><rect x="34" y="234" width="3" height="20" fill="#fbbf24" fill-opacity="0.8"/><text x="44" y="247.2" font-family="ui-monospace,'Cascadia Mono',Consolas,'DejaVu Sans Mono',monospace" font-size="9" font-weight="400" fill="#cbd5e1" fill-opacity="1" text-anchor="start">mutating calls</text><text x="286" y="247.2" font-family="ui-monospace,'Cascadia Mono',Consolas,'DejaVu Sans Mono',monospace" font-size="8.6" font-weight="400" fill="#fbbf24" fill-opacity="1" text-anchor="end">4, premium</text>
<rect x="330" y="138" width="292" height="128" fill="rgba(255,255,255,0.02)" fill-opacity="1" stroke="#334155" stroke-opacity="0.8" stroke-width="1"/><path d="M330 146V138H338" fill="none" stroke="#fbbf24" stroke-width="1.5" stroke-opacity="0.75"/><path d="M614 138H622V146" fill="none" stroke="#fbbf24" stroke-width="1.5" stroke-opacity="0.75"/><path d="M330 258V266H338" fill="none" stroke="#fbbf24" stroke-width="1.5" stroke-opacity="0.75"/><path d="M614 266H622V258" fill="none" stroke="#fbbf24" stroke-width="1.5" stroke-opacity="0.75"/><text x="346" y="160" font-family="ui-monospace,'Cascadia Mono',Consolas,'DejaVu Sans Mono',monospace" font-size="8.5" font-weight="400" fill="#475569" fill-opacity="1" text-anchor="start" letter-spacing="1.6">THE RULES</text>
<text x="346" y="182" font-family="ui-monospace,'Cascadia Mono',Consolas,'DejaVu Sans Mono',monospace" font-size="8" font-weight="400" fill="#cbd5e1" fill-opacity="1" text-anchor="start">MAIN THREAD ONLY. THERE IS NO</text>
<text x="346" y="198" font-family="ui-monospace,'Cascadia Mono',Consolas,'DejaVu Sans Mono',monospace" font-size="8" font-weight="400" fill="#cbd5e1" fill-opacity="1" text-anchor="start">LOCK THAT WOULD MAKE IT SAFE.</text>
<text x="346" y="220" font-family="ui-monospace,'Cascadia Mono',Consolas,'DejaVu Sans Mono',monospace" font-size="8" font-weight="400" fill="#cbd5e1" fill-opacity="1" text-anchor="start">RESOLVE IN onEnable, NOT STATIC.</text>
<text x="346" y="240" font-family="ui-monospace,'Cascadia Mono',Consolas,'DejaVu Sans Mono',monospace" font-size="8" font-weight="400" fill="#cbd5e1" fill-opacity="1" text-anchor="start">HANDLES SURVIVE A RELOAD.</text>
<text x="346" y="256" font-family="ui-monospace,'Cascadia Mono',Consolas,'DejaVu Sans Mono',monospace" font-size="8" font-weight="400" fill="#cbd5e1" fill-opacity="1" text-anchor="start">DEFINITION VIEWS DO NOT.</text>
<text x="20" y="288" font-family="ui-monospace,'Cascadia Mono',Consolas,'DejaVu Sans Mono',monospace" font-size="9" font-weight="400" fill="#cbd5e1" fill-opacity="1" text-anchor="start">EVERY QUERY AND EVERY EVENT WORKS ON LITE TOO</text>
<text x="620" y="288" font-family="ui-monospace,'Cascadia Mono',Consolas,'DejaVu Sans Mono',monospace" font-size="9" font-weight="400" fill="#64748b" fill-opacity="1" text-anchor="end">apiVersion() SAYS WHEN IT MOVED</text>
