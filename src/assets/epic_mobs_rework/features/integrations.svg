<text x="34" y="88" font-family="ui-monospace,'Cascadia Mono',Consolas,'DejaVu Sans Mono',monospace" font-size="8.4" font-weight="400" fill="#cbd5e1" fill-opacity="1" text-anchor="start">MOBS TRIGGER THE CE3 ENCHANTS</text>
<text x="34" y="108" font-family="ui-monospace,'Cascadia Mono',Consolas,'DejaVu Sans Mono',monospace" font-size="8.4" font-weight="400" fill="#cbd5e1" fill-opacity="1" text-anchor="start">ON THEIR OWN GEAR</text>
