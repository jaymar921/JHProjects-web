<text x="346" y="132" font-family="ui-monospace,'Cascadia Mono',Consolas,'DejaVu Sans Mono',monospace" font-size="8.4" font-weight="400" fill="#cbd5e1" fill-opacity="1" text-anchor="start">REACHES A PLAYER WHO LOGGED</text>
<text x="346" y="152" font-family="ui-monospace,'Cascadia Mono',Consolas,'DejaVu Sans Mono',monospace" font-size="8.4" font-weight="400" fill="#cbd5e1" fill-opacity="1" text-anchor="start">OUT MID BOSS FIGHT</text>
<text x="346" y="180" font-family="ui-monospace,'Cascadia Mono',Consolas,'DejaVu Sans Mono',monospace" font-size="8.4" font-weight="400" fill="#cbd5e1" fill-opacity="1" text-anchor="start">PAY Kd, PAY RACO, OR BOTH</text>
<rect x="18" y="212" width="604" height="54" fill="rgba(255,255,255,0.02)" fill-opacity="1" stroke="#334155" stroke-opacity="0.8" stroke-width="1"/><path d="M18 220V212H26" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.75"/><path d="M614 212H622V220" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.75"/><path d="M18 258V266H26" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.75"/><path d="M614 266H622V258" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.75"/><text x="34" y="234" font-family="ui-monospace,'Cascadia Mono',Consolas,'DejaVu Sans Mono',monospace" font-size="8.5" font-weight="400" fill="#475569" fill-opacity="1" text-anchor="start" letter-spacing="1.6">AND THE USUAL SUSPECTS</text>
<text x="34" y="250" font-family="ui-monospace,'Cascadia Mono',Consolas,'DejaVu Sans Mono',monospace" font-size="8.4" font-weight="400" fill="#cbd5e1" fill-opacity="1" text-anchor="start">VAULT   -   WORLDGUARD   -   PLACEHOLDERAPI   -   ITS OWN REGIONS</text>
<text x="20" y="288" font-family="ui-monospace,'Cascadia Mono',Consolas,'DejaVu Sans Mono',monospace" font-size="9" font-weight="400" fill="#cbd5e1" fill-opacity="1" text-anchor="start">MISSING ONE? THE INTEGRATION STAYS OFF, NOTHING THROWS</text>
<text x="620" y="288" font-family="ui-monospace,'Cascadia Mono',Consolas,'DejaVu Sans Mono',monospace" font-size="9" font-weight="400" fill="#64748b" fill-opacity="1" text-anchor="end">NO SHADED CLASSES</text>
