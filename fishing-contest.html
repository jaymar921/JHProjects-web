    <!--
      Social crawlers do not run JavaScript, so the tags a link preview needs
      have to be in the HTML that is served. This is a Vite entry point that

    -->
    <title>Fishing Contest | Archived Minecraft event plugin</title>
    <meta
      name="description"
      content="Fishing Contest, an archived Minecraft plugin by JayMar921. A server wide fishing event on a timer, with a live leaderboard, Vault payouts and four languages. Spigot 1.16 to 1.18, last updated August 2021."
    />
    <link
      rel="canonical"
      href="https://jhprojects.vercel.app/fishing-contest"
    />
    <meta name="theme-color" content="#04121a" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="JHProjects" />
    <meta
      property="og:url"
      content="https://jhprojects.vercel.app/fishing-contest"
    />
    <meta
      property="og:title"
      content="Fishing Contest | Archived Minecraft event plugin"
    />
    <meta
      property="og:description"
      content="Archived, and still on Spigot. A server wide fishing event that ran itself, with a live leaderboard, Vault payouts and four languages. Minecraft 1.16 to 1.18, by JayMar921."
    />
    <meta
      property="og:image"
      content="https://jhprojects.vercel.app/og/fishing-contest.png"
    />
    <meta
      property="og:image:secure_url"
      content="https://jhprojects.vercel.app/og/fishing-contest.png"
    />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />

      property="og:image:alt"
      content="Fishing Contest, an archived Minecraft plugin with a server wide fishing event and leaderboard"

      name="twitter:title"

    <meta
