    <!--
      Social crawlers do not run JavaScript, so the tags a link preview needs
      have to be in the HTML that is served. This file is another Vite entry
      point booting the same React app, and vercel.json points
      /epic-mobs-rework at it.

      1.0-RC2 is published. Every description below says release candidate,
      because a preview that reads like a finished 1.0 is how somebody ends up
      putting a build meant for testing onto a live server without knowing it.
      That word comes out of these tags on the day 1.0 does, and not before.
    -->
    <title>Epic Mobs Rework | Custom mobs, bosses and raids for Spigot</title>
    <meta
      name="description"
      content="A rebuilt Minecraft mob plugin for Spigot and Paper 1.16.5 and up. Custom mobs from any vanilla entity, abilities with telegraphs, boss phases, companions, raids, arenas and weighted loot. Free Lite build alongside a one-payment full build on pre-release sale at £7.99, £15.99 once 1.0 ships. Twenty mobs, a raid, a pack and an arena in the box, forty mobs and four raids on the full build. 1.0-RC2 out now, a release candidate. By JayMar921."
    />
