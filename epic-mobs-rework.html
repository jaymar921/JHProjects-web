    <!--
      Social crawlers do not run JavaScript, so the tags a link preview needs
      have to be in the HTML that is served. This file is another Vite entry
      point booting the same React app, and vercel.json points
      /epic-mobs-rework at it.

      The plugin has not shipped. Every description below says so, because a
      preview that reads like a released plugin is how somebody ends up looking
      for a download that does not exist.
    -->
    <title>Epic Mobs Rework | Custom mobs, bosses and raids for Spigot</title>
    <meta
      name="description"
      content="A rebuilt Minecraft mob plugin for Spigot and Paper 1.16.5 and up. Custom mobs from any vanilla entity, abilities with telegraphs, boss phases, companions, raids, arenas and weighted loot. Free Lite build alongside a one-payment full build. In development, no release date. By JayMar921."
    />
    <link
      rel="canonical"
      href="https://jhprojects.vercel.app/epic-mobs-rework"
    />
    <meta name="theme-color" content="#0e1014" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="JHProjects" />
    <meta
      property="og:url"
      content="https://jhprojects.vercel.app/epic-mobs-rework"
    />
    <meta
      property="og:title"
      content="Epic Mobs Rework | Custom mobs, bosses and raids for Spigot"
    />
    <meta
      property="og:description"
      content="Build the mob. Give it abilities. Decide where it lives and what it leaves behind. Spigot and Paper 1.16.5 and up, no NMS, nothing else required. In development, no release date yet."
    />
    <meta
      property="og:image"
      content="https://jhprojects.vercel.app/og/epic-mobs-rework.png"
    />

      property="og:image:secure_url"
